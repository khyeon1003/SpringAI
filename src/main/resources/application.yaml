spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: springai

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/springai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
          temperature: ${OPENAI_CHAT_TEMPERATURE:0.2}
          max-tokens: ${OPENAI_CHAT_MAX_TOKENS:1024}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always

    vectorstore:
      pgvector:
        initialize-schema: true
        schema-name: public
        table-name: vector_store
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        remove-existing-vector-store-table: false

app:
  rag:
    # RAGAS FactualCorrectness 측정 결과에 따라 4에서 8로 올렸다. 기대 사실을 담은 청크가
    # 5~6위에 있어 4개로는 잘렸다. evaluation/results 의 두 실행을 비교하면 근거가 남아 있다.
    top-k: ${RAG_TOP_K:8}
    # 코사인 유사도 하한. chunk-dump/threshold/_report.md 의 실측 분포를 근거로 정했다.
    # 문서에 답이 있는 질문의 근거 청크는 0.543 이상, 문서에 없는 학사 질문의 최상위 노이즈는 0.530 이하였다.
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.54}
  chat:
    memory:
      # 대화 윈도우 크기. 사용자와 어시스턴트 메시지를 합한 개수다.
      max-messages: ${CHAT_MEMORY_MAX_MESSAGES:20}
  metrics:
    token-usage:
      average-limit: ${TOKEN_USAGE_AVERAGE_LIMIT:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
